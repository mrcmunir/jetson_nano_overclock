name: Build Jetson Nano Kernel Natively

on:
  push:
    branches:
      - jetson_nano_overlock 

jobs:
  build-kernel:
    runs-on: ubuntu-latest  

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up QEMU for ARM64
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu qemu-user-static binfmt-support

    - name: Build and run Docker container
      run: |
        # Dockerfile temporal
        cat <<EOF > Dockerfile
        FROM arm64v8/ubuntu:18.04

        # Install dependencies
        RUN apt-get update && apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            bc \
            wget \
            git \
            && rm -rf /var/lib/apt/lists/*

        # copy container
        COPY . /jetson_nano_kernel

        # directory temp
        WORKDIR /jetson_nano_kernel

        # Compilar el kernel y realizar los pasos adicionales
        CMD ./nvbuild.sh && \
            cd kernel/kernel-4.9 && \
            sudo make modules && \
            sudo make modules_install && \
            sudo make && \
            sudo make install && \
            cp arch/arm64/boot/Image /boot/Image && \
            cp -r arch/arm64/boot/dts/* /boot/
        EOF

        # Construir y ejecutar el contenedor
        docker build -t jetson-kernel-builder .
        docker run --rm --privileged jetson-kernel-builder

    - name: Extract artifacts from Docker container
      run: |
        # Docker create
        docker create --name temp-container jetson-kernel-builder
        docker cp temp-container:/boot ./boot
        docker cp temp-container:/lib/modules ./modules
        docker rm temp-container

    - name: Package Image, DTBs, and modules
      run: |
        mkdir -p output/kernel
        cp -r boot/* output/kernel/
        cp -r modules/* output/kernel/modules/
        zip -r kernel.zip output

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip
