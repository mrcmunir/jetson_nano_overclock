name: Build Jetson Nano Kernel

on:
  push:
    branches:
      - jetpack32.7.4

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget xz-utils

    - name: Download and extract Linaro GCC 7.3.1 toolchain
      run: |
        wget https://developer.nvidia.com/embedded/dlc/l4t-gcc-7-3-1-toolchain-64-bit -O gcc-linaro-7.3.1.tar.xz
        mkdir -p gcc-linaro-7.3.1
        tar -xf gcc-linaro-7.3.1.tar.xz -C gcc-linaro-7.3.1 --strip-components=1
        rm gcc-linaro-7.3.1.tar.xz
        echo "Toolchain extracted to $PWD/gcc-linaro-7.3.1"

    - name: Verify toolchain extraction
      run: |
        echo "Contents of gcc-linaro-7.3.1/bin:"
        ls -l $PWD/gcc-linaro-7.3.1/bin
        echo "Checking for aarch64-linux-gnu-gcc:"
        ls -l $PWD/gcc-linaro-7.3.1/bin/aarch64-linux-gnu-gcc
        echo "Checking for aarch64-linux-gnu-g++:"
        ls -l $PWD/gcc-linaro-7.3.1/bin/aarch64-linux-gnu-g++

    - name: Set up cross-compilation environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE_AARCH64=$PWD/gcc-linaro-7.3.1/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "$PWD/gcc-linaro-7.3.1/bin" >> $GITHUB_PATH
        echo "CROSS_COMPILE_AARCH64 set to $CROSS_COMPILE_AARCH64"
        echo "PATH updated to include toolchain: $PWD/gcc-linaro-7.3.1/bin"

    - name: Verify toolchain availability
      run: |
        echo "Checking gcc version:"
        aarch64-linux-gnu-gcc --version
        echo "Checking g++ version:"
        aarch64-linux-gnu-g++ --version

    - name: Compile kernel
      run: |
        echo "Compiling kernel with CROSS_COMPILE_AARCH64=$CROSS_COMPILE_AARCH64"
        sudo -E ./nvbuild.sh

    - name: Install modules
      run: |
        cd kernel/kernel-4.9
        sudo make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE_AARCH64 modules
        sudo make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE_AARCH64 modules_install INSTALL_MOD_PATH=$PWD/modules

    - name: Compile and install kernel
      run: |
        cd kernel/kernel-4.9
        sudo make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE_AARCH64
        sudo make ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE_AARCH64 install INSTALL_PATH=$PWD/boot

    - name: Package Image and modules
      run: |
        mkdir -p output/kernel
        cp kernel/kernel-4.9/arch/arm64/boot/Image output/kernel/
        cp -r kernel/kernel-4.9/modules/lib/modules/* output/kernel/modules/
        zip -r kernel.zip output

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip
